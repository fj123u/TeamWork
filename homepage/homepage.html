<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="homepage.css">
    <title>HomePage</title>
</head>

<body>
    <header class="navBarre">
        <a href="../profile/profile.html" class="profil-link">
            <img id="avatar" src="" alt="Photo de profil">
            <span id="userName"></span>
        </a>
        <h2 class="logo-text">TeamWork</h2>
        <div class="nav-actions">
            <a href="../profile/profile.html">
                <button class="btn">Voir mon profil</button>
            </a>
            <button id="add" class="btn btn-primary">Publier</button>
            <button id="disconnect" class="btn btn-danger">Se deconnecter</button>
        </div>
    </header>

    <div class="content">
        <aside class="sidebar">
            <div class="recherche-box">
                <label for="recherche">Rechercher un utilisateur</label>
                <input id="recherche" list="suggestion" name="Recherche" placeholder="Ex : Dupont">
                <datalist id="suggestion"></datalist>
            </div>
            <div id="profilRecherche"></div>
            <div id="stats"></div>
        </aside>

        <main class="feed">
            <div class="recherche-box">
                <label for="recherchePost">Rechercher dans les posts</label>
                <input id="recherchePost" type="text" placeholder="Ex : titre, mot-clé...">
                <label for="filtreAuteur">Filtre auteur</label>
                <input id="filtreAuteur" list="suggestionAuteur" type="text" placeholder="Ex : Dupont">
                <datalist id="suggestionAuteur"></datalist>
                <p id="compteurResultats"></p>
            </div>
            <form id="form-post"></form>
            <div id="posts"></div>
        </main>
    </div>
    <script src="homepage.js"></script>
</body>

</html>
